name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Tự động chạy mỗi 12 tiếng
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay
  push:
    branches:
      - main # Chạy mỗi khi bạn push code mới lên branch main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Lấy mã nguồn từ repo
      - name: Checkout
        uses: actions/checkout@v4
        
      # Chạy bot tạo ảnh con rắn ăn ô đóng góp
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Đẩy file ảnh SVG vừa tạo sang một branch tên là "output"
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
